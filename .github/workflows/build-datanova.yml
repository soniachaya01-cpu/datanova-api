name: CI/CD – Build & Push Docker (DataNova)

on:
  push:
    branches: [ "main" ]   # تشغيل تلقائي عند أي push على main
  workflow_dispatch: {}     # ويسمح بالتشغيل اليدوي من تبويب Actions

permissions:
  contents: read

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # (اختياري) فقط لتثبيت المتطلبات بسرعة، بدون اختبارات
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (no tests)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .           # VERY IMPORTANT: يبني من جذر المشروع
          push: true           # ادفع الصورة إلى Docker Hub
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/datanova-api:latest
            ${{ secrets.DOCKER_USERNAME }}/datanova-api:${{ github.sha }}
