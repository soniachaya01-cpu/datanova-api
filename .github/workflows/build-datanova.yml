name: CI/CD – Build & Push Docker (DataNova)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (for tests only)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps & run tests
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -d tests ]; then python -m pytest -q || exit 1; fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .     # ← هذا السطر هو الذي كان ناقصًا
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/datanova-api:latest
            ${{ secrets.DOCKER_USERNAME }}/datanova-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
